# CI: unit tests backend + build frontend mỗi lần push/PR
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install deps (bộ nhẹ — không torch/easyocr)
        run: pip install -r backend/requirements-ci.txt
      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build (typecheck + lint)
        working-directory: frontend
        run: npm run build
